[project]
name = "driver-drowsiness-detection"
version = "1.0.0"
description = "Real-time driver drowsiness detection with a CNN-LSTM, TensorFlow and OpenCV"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oussama Knouz" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
